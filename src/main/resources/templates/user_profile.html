<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: content">
<head>
    <meta charset="UTF-8">
    <title>User Profile - PetAdopt</title>
</head>
<body>
<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm text-center p-4">
            <img th:src="${user.avatarUrl} ?: 'https://via.placeholder.com/150'" class="rounded-circle mb-3" alt="avatar">
            <h4 th:text="${user.username}">Username</h4>
            <p class="text-muted" th:text="${user.email}">email@example.com</p>
            <a th:href="@{/applications}" class="btn btn-outline-primary btn-sm">我的申请</a>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card shadow-sm p-3">
            <h5>我的信息</h5>
            <dl class="row">
                <dt class="col-sm-3">居住类型</dt>
                <dd class="col-sm-9" th:text="${user.residenceType}">楼房</dd>

                <dt class="col-sm-3">养宠经验</dt>
                <dd class="col-sm-9" th:text="${user.petExperience}">3年</dd>

                <dt class="col-sm-3">家庭人口</dt>
                <dd class="col-sm-9" th:text="${user.familySize}">3</dd>
            </dl>
        </div>
    </div>
</div>
</body>
</html>
