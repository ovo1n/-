<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: content">
<head>
    <meta charset="UTF-8">
    <title th:text="${pet.name} + ' - PetAdopt'">Pet Detail</title>
</head>
<body>
<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <img th:src="${pet.imageUrl} ?: 'https://via.placeholder.com/800x500?text=Pet'" class="card-img-top" alt="pet">
            <div class="card-body">
                <h3 th:text="${pet.name}">Pet Name</h3>
                <p class="text-muted" th:text="${pet.breed}">Breed</p>
                <p th:text="${pet.description}">Detailed description...</p>
                <p>年龄: <span th:text="${pet.age}">2</span> 岁</p>
                <p>体型: <span th:text="${pet.size}">中型</span></p>
                <p>健康: <span th:text="${pet.healthStatus}">健康</span></p>
                <div class="mt-3">
                    <a th:href="@{/apply/{petId}(petId=${pet.id})}" class="btn btn-success btn-lg">申请领养</a>
                    <a th:href="@{/matching}" class="btn btn-outline-secondary">返回推荐</a>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <h5>详细信息</h5>
            <ul class="list-unstyled">
                <li><strong>疫苗:</strong> <span th:text="${pet.isVaccinated == 1 ? '已接种' : '未接种'}">已接种</span></li>
                <li><strong>绝育:</strong> <span th:text="${pet.isNeutered == 1 ? '已绝育' : '未绝育'}">已绝育</span></li>
                <li><strong>性格:</strong> <span th:text="${pet.personality}">温和 友好</span></li>
                <li><strong>领养状态:</strong> <span th:text="${pet.status}">待领养</span></li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
