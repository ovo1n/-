<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: content">
<head>
    <meta charset="UTF-8">
    <title>Home - PetAdopt</title>
</head>
<body>
<section class="hero py-5 text-white" style="background: linear-gradient(135deg,#6dd5ed 0%,#2193b0 100%);">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-7">
                <h1 class="display-5 fw-bold">给流浪宠物一个温暖的家</h1>
                <p class="lead">发现、匹配并领养心仪的宠物，我们帮你智能推荐最合适的伙伴。</p>
                <a class="btn btn-light btn-lg" th:href="@{/pets}">查看可领养宠物</a>
            </div>
            <div class="col-md-5 text-center">
                <img src="https://images.unsplash.com/photo-1558788353-f76d92427f16?w=700&q=80&auto=format&fit=crop" class="img-fluid rounded shadow" alt="pets">
            </div>
        </div>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <h2 class="mb-4">推荐宠物</h2>
        <div class="row g-4">
            <div class="col-md-4" th:each="rec : ${recommendations}">
                <div class="card h-100 shadow-sm">
                    <img th:src="${rec.pet.imageUrl} ?: 'https://via.placeholder.com/600x350?text=Pet'" class="card-img-top" alt="pet">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${rec.pet.name}">Pet Name</h5>
                        <p class="card-text text-muted small" th:text="${rec.pet.breed}">Breed</p>
                        <p class="mb-2">匹配度: <span class="fw-bold" th:text="${#numbers.formatDecimal(rec.matchingScore, 1, 'POINT', 1, 'NONE')}">88.5</span>%</p>
                        <a th:href="@{/pets/{id}(id=${rec.pet.id})}" class="btn btn-primary">查看详情</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
