version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: petadopt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword     # 本地测试用；生产请使用 secrets
      MYSQL_DATABASE: petadopt
      MYSQL_USER: pet_user
      MYSQL_PASSWORD: pet_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/db_setup.sql:/docker-entrypoint-initdb.d/db_setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
